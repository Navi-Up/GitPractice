<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify — 재밌는 사이트 모음</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>

  <div class="container container-narrow">

    <nav class="detail-nav">
      <a href="../../index.html">← 목록으로</a>
    </nav>

    <!-- ① 제목과 한 줄 소개 -->
    <header class="detail-head">
      <div class="detail-thumb" style="--thumb:#ffe4c2">🧪</div>
      <div>
        <h1>Spotify</h1> <!-- 제목 -->
        <p>내 취향에 맞는 음악 추천 앱</p> <!-- 한 줄 소개 -->
      </div>
    </header>

    <!-- ② 어떤 사이트인가 -->
    <section class="detail-section">
      <h2>어떤 사이트인가요</h2> 
      <p> <!-- 어떤 사이트인지 소개 -->
      2006년 스웨덴에서 시작된 
      세계 최대 규모의 디지털 음악 및 팟캐스트 스트리밍 플랫폼입니다.
      </p>
    </section>

    <!-- ③ 이럴 때 좋아요 -->
    <section class="detail-section">
      <h2>이럴 때 좋아요</h2>
      <p> <!-- 이럴 때 좋아요 -->
        <ul>
          <li>출근, 퇴근하는 중 힘들 때</li>
          <li>상황, 취향, 기분에 맞춰 음악 추천이 필요할 때</li>
          <li>노래를 듣고 싶을 때</li>
        </ul>
      </p>
    </section>

    <!-- ④ 원래 사이트로 이동하는 링크 --> 
    <a class="visit" href="https://open.spotify.com/" target="_blank" rel="noopener">
      Spotify 으로 이동하기 →
    </a>
    <p class="visit-note">새 탭에서 열립니다</p>

    <!-- ⑤ 추천한 사람 -->
    <footer class="detail-foot">
      추천 · 이현종
    </footer>

  </div>

</body>
</html>
